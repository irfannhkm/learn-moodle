services:
  moodleapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: moodle-web:1.0
    container_name: moodle-web
    restart: unless-stopped
    ports:
      - ${MOODLE_PORT:-2080}:80
    volumes:
      - moodledata:/var/www/moodledata
      - moodlefile:/var/www/html
    environment:
      - MOODLE_DB_TYPE=pgsql
      - MOODLE_DB_HOST=postgres
      - MOODLE_DB_NAME=${POSTGRES_DB:-moodle}
      - MOODLE_DB_USER=${POSTGRES_USER:-moodle}
      - MOODLE_DB_PASS=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-moodle-redis}
      - REDIS_PORT=${REDIS_PORT:-6099}
    networks:
      - proxy-tier
    depends_on:
      - postgres
      - redis

  cron:
    image: moodle-web:1.0
    container_name: moodle-cron
    restart: unless-stopped
    command: sh -c "while true; do php /var/www/html/admin/cli/cron.php; sleep 60; done"
    volumes:
      - moodledata:/var/www/moodledata
      - moodlefile:/var/www/html
    depends_on:
      - moodleapp
      - postgres
      - redis
    networks:
      - proxy-tier

  postgres:
    image: postgres:17-alpine
    container_name: moodle-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=512MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-moodle}
      - POSTGRES_USER=${POSTGRES_USER:-moodle}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - proxy-tier

  redis:
    image: redis:7-alpine
    container_name: moodle-redis
    restart: unless-stopped
    command: ["redis-server", "--port", "${REDIS_PORT:-6099}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6099}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - proxy-tier

  pgadmin:
    image: dpage/pgadmin4
    container_name: moodle-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - proxy-tier
    depends_on:
      - postgres

volumes:
  moodledata:
  moodlefile:
  postgres_data:
  pgadmin_data:

networks:
  proxy-tier:
    external: true